[project]
name = "nox-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.11,<7",
  "openpyxl>=3.1,<3.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller>=6.19"]

[project.scripts]
dev = "app._taches:dev"
test = "app._taches:test"
lint = "app._taches:lint"
couches = "app._taches:couches"
build = "app._taches:build"

# Le code vit dans 01_application/. Le préfixe numérique ordonne les dossiers
# dans l'explorateur ; ces réglages suffisent à ce que Python s'y retrouve.
[tool.hatch.build.targets.wheel]
packages = ["01_application/app"]

[tool.pytest.ini_options]
pythonpath = ["01_application"]
testpaths = ["01_application/tests"]

[tool.ruff]
line-length = 100
src = ["01_application"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
