<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cercle bleu façon drapeau européen -->
  <circle cx="50" cy="50" r="48" fill="#003399"/>

  <!-- 12 étoiles dorées disposées en cercle -->
  <g fill="#FFCC00">
    <!-- étoile générique réutilisée par rotation -->
    <g id="star">
      <polygon points="0,-8 1.76,-2.47 7.6,-2.47 2.94,1.06 4.7,6.59 0,3.06 -4.7,6.59 -2.94,1.06 -7.6,-2.47 -1.76,-2.47"/>
    </g>
    <use href="#star" transform="translate(50,14)"/>
    <use href="#star" transform="translate(68,19)"/>
    <use href="#star" transform="translate(81,32)"/>
    <use href="#star" transform="translate(86,50)"/>
    <use href="#star" transform="translate(81,68)"/>
    <use href="#star" transform="translate(68,81)"/>
    <use href="#star" transform="translate(50,86)"/>
    <use href="#star" transform="translate(32,81)"/>
    <use href="#star" transform="translate(19,68)"/>
    <use href="#star" transform="translate(14,50)"/>
    <use href="#star" transform="translate(19,32)"/>
    <use href="#star" transform="translate(32,19)"/>
  </g>
</svg>
