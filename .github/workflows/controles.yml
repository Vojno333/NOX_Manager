# Contrôles automatiques : mise en forme, lint, tests et couches, à chaque envoi.
# Windows, comme les postes qui exécutent l'application ; Qt tourne hors écran.
name: Contrôles

on:
  push:
  pull_request:

jobs:
  controles:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Dépendances
        run: uv sync --locked --extra dev

      - name: Mise en forme
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

      - name: Couches
        run: uv run couches
